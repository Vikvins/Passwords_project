name: Publish WinForms Application

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore ./passwords_project.sln

      - name: Publish application
        run: dotnet publish passwords_project.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PasswordGenerator-WinForms
          path: bin/Release/net6.0-windows/win-x64/publish/*
          retention-days: 7
